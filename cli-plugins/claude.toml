# Claude Code CLI plugin.
#
# Spawned under swarmx-shim. HOME is passed through so the agent reads
# OAuth credentials from ~/.claude/.credentials.json on first launch (and
# subsequent launches skip the OAuth flow).

id = "claude"
display_name = "Claude Code"
binary = "claude"
# Skip per-tool approval prompts. swarmx workspaces are ephemeral,
# isolated, swarmx-owned; without this every MCP swarm_* tool call
# would gate on a manual "1. Yes" in the PTY and block M5-style
# autonomous coordination.
default_args = ["--dangerously-skip-permissions"]
home_env = "HOME"
# Claude must stay on the interactive subscription surface by default. Do not
# switch this plugin to `claude -p`, SDK, or ACP-adapter flows without an
# explicit paid-transport opt-in in server code.
billing_surface = "interactive-subscription"
requires_explicit_billing_opt_in = false
# Keep ambient API credentials out of the child by default. If ANTHROPIC_API_KEY
# reaches Claude Code, it can prefer API billing over the user's interactive
# Claude subscription login.
blocked_env_prefixes = ["ANTHROPIC_"]
# Provider env families this CLI may consume (spawn.rs forwards ONLY declared
# prefixes, still intersected with blocked_env_prefixes above). claude's own
# config family is CLAUDE_* (e.g. CLAUDE_CONFIG_DIR; the CLAUDE_CODE_* nesting
# markers are stripped separately in spawn.rs). ANTHROPIC_ is declared so a
# deliberate user opt-in (dropping the block via a plugin overlay) can still
# pass an API key through — by default the block wins and NOTHING ANTHROPIC_*
# reaches the child. No other provider's prefix is declared: OPENAI_/DEEPSEEK_
# keys must never enter this full-shell agent.
provider_env_prefixes = ["ANTHROPIC_", "CLAUDE_"]
# Workspaces we create under ~/.swarmx/workspaces/ are trusted by
# construction; pre-patch the per-project flag so claude doesn't prompt.
auto_trust_workspace = true
# Pre-spawn writes ~/.claude.json projects.<ws>.mcpServers.swarmx-swarm
# (local scope ⇒ no "trust this MCP server?" prompt). Per-spawn entry
# carries the agent_id.
auto_inject_mcp = true
# Pre-spawn writes a `Stop` hook into <workspace>/.claude/settings.local.json
# that calls `swarmx-mcp wake-check`. At every turn boundary the hook
# probes /api/message/unread_count; if the agent has unread mail, the hook
# returns `{decision:"block", reason:"..."}` and claude continues into a
# new turn that picks the messages up via swarm_list_messages.
auto_inject_stop_hook = true

# Which config FORMAT each auto_* patch uses. pre_spawn.rs dispatches on
# these, NOT on `id` — so behavior is data-driven and a claude-compatible
# CLI could reuse these values verbatim with zero Rust changes.
trust_format     = "claude-json"           # ~/.claude.json hasTrustDialogAccepted
mcp_format       = "claude-local-scope"    # ~/.claude.json local scope + per-agent --mcp-config
stop_hook_format = "claude-settings-local" # <ws>/.claude/settings.local.json (timeout ms)
stop_hook_timeout = 10000                  # milliseconds (claude's hook schema unit)
input_settle_ms = 0                        # claude accepts keystrokes immediately after ready

# L5c model overlay: how to pass a model to claude. {model} is substituted at
# spawn time with the per-spawn `model` (REST/MCP) or `default_model` below.
# claude accepts an alias ('opus'/'sonnet') or a full model id. With no
# default_model set, claude uses its own configured default.
model_args = ["--model", "{model}"]
# claude's --model natively accepts the opus/sonnet/haiku aliases — the tier
# vocabulary IS claude's own lineup, so the 模型 settings page shows these rows.
native_tiers = true

# Reasoning effort overlay. 2026 Claude Code takes `--effort <level>` (per
# session); {effort} is the concrete value from effort_levels below. Omitted
# when the direction has no effort set → the model's own default (high on Opus
# 4.8). Unsupported levels degrade to the highest the model supports (no error);
# Haiku has no effort, so the flag is a documented no-op there.
effort_args = ["--effort", "{effort}"]
[effort_levels]
low = "low"
medium = "medium"
high = "high"      # claude's own default on Opus 4.8 / Sonnet 4.6
xhigh = "xhigh"    # one above default; Opus 4.7/4.8 (degrades to high on 4.6)
max = "max"        # claude's true ceiling, supported on the effort-aware models

# Health needles — PTY-output signatures that mean "alive but can't actually
# work". The pump's HealthScanner watches these continuously and, on the first
# match, raises AgentState::Error so the UI shows an honest, actionable failure
# card instead of a fake "online" dot + "暂无消息".
#
# "Not logged in" is verified against a real swarmx recording: claude prints
# "Not logged in · Run /login" (and "… · Please run /login") verbatim when no
# OAuth credential is present. The common substring is the stable needle.
[[health_needles]]
needle = "Not logged in"
reason = "Claude Code 未登录，请在终端运行 claude /login"
kind = "auth"
